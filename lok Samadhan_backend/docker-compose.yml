services:
  # Lok Samadhan Node.js Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lok_samadhan_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - DATABASE_URL=postgresql://lok_user:lok_secure_password_2026@postgres:5432/lok_samadhan_db
      - OSM_NOMINATIM_BASE_URL=https://nominatim.openstreetmap.org
      - OSM_USER_AGENT=LokSamadhan-CivicApp/1.0 (contact@lok-samadhan.gov.in)
      - JWT_SECRET=${JWT_SECRET:-lok_samadhan_production_secret_key_2026}
      - CORS_ORIGIN=*
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lok_network

  # Optional Local/Droplet PostgreSQL Container
  postgres:
    image: postgres:16-alpine
    container_name: lok_samadhan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lok_user
      POSTGRES_PASSWORD: lok_secure_password_2026
      POSTGRES_DB: lok_samadhan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lok_user -d lok_samadhan_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lok_network

networks:
  lok_network:
    driver: bridge

volumes:
  postgres_data:
